name: Build Timer

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Timer/Timer.csproj

      - name: Build
        run: dotnet build Timer/Timer.csproj -c Release -p:Platform=x64 -p:TreatWarningsAsErrors=false --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Timer-build
          path: |
            Timer/bin/Release/net10.0/linux-x64/Timer.dll
            Timer/bin/Release/net10.0/linux-x64/Timer.deps.json
            Timer/bin/Release/net10.0/linux-x64/Timer.runtimeconfig.json
            Timer.Shared/bin/Release/net10.0/Timer.Shared.dll
            Timer.Shared/bin/Release/net10.0/Timer.Shared.deps.json
            Timer.Shared/bin/Release/net10.0/Timer.Shared.runtimeconfig.json
          if-no-files-found: error
